<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐먹지?</title>
  <meta name="description" content="조건에 맞는 맛집을 찾아주는 맛집 추천 웹 애플리케이션">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Style -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- 배경 글로우 데코레이션 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="app-container">
    <!-- 헤더 -->
    <header class="app-header">
      <div class="brand-area">
        <div class="logo-badge">
          <span class="logo-emoji">🍽️</span>
        </div>
        <div class="brand-text">
          <div class="brand-title">
            <span class="brand-highlight">오늘 뭐먹지?</span>
          </div>
          <p class="brand-subtitle">조건만 입력하면 나에게 맞는 맛집을 찾아드려요</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- 테마 토글 버튼 -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="라이트/다크 테마 전환" aria-label="테마 변경">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 히어로 영역 -->
    <section class="hero-section">
      <h1 class="hero-title">오늘 어디서 뭐 먹지?</h1>
      <p class="hero-sub">지역, 음식 종류, 예산, 분위기를 알려주시면 딱 맞는 맛집을 추천해드려요.</p>
    </section>

    <!-- 조건 입력 폼 (Glassmorphic Card) -->
    <section class="search-card">
      <form id="recommendForm">
        <!-- 지역 -->
        <div class="form-block">
          <label class="form-block-label" for="locationInput">지역</label>
          <input type="text" id="locationInput" class="task-text-input" placeholder="예: 강남, 홍대, 성수, 잠실..." autocomplete="off">
          <div class="quick-chips" id="regionChips">
            <button type="button" class="preset-chip" data-value="강남">강남</button>
            <button type="button" class="preset-chip" data-value="홍대">홍대</button>
            <button type="button" class="preset-chip" data-value="성수">성수</button>
            <button type="button" class="preset-chip" data-value="잠실">잠실</button>
            <button type="button" class="preset-chip" data-value="서울">서울</button>
          </div>
        </div>

        <!-- 음식 종류 -->
        <div class="form-block">
          <label class="form-block-label">음식 종류</label>
          <div class="chip-select-group" id="foodTypeGroup" role="group" aria-label="음식 종류 선택">
            <button type="button" class="chip-select" data-value="한식">한식</button>
            <button type="button" class="chip-select" data-value="중식">중식</button>
            <button type="button" class="chip-select" data-value="일식">일식</button>
            <button type="button" class="chip-select" data-value="양식">양식</button>
            <button type="button" class="chip-select" data-value="치킨">치킨</button>
            <button type="button" class="chip-select" data-value="고기">고기</button>
            <button type="button" class="chip-select" data-value="카페">카페</button>
            <button type="button" class="chip-select" data-value="디저트">디저트</button>
            <button type="button" class="chip-select active" data-value="상관없음">상관없음</button>
          </div>
        </div>

        <div class="form-row-2">
          <!-- 예산 -->
          <div class="form-block">
            <label class="form-block-label" for="budgetSelect">예산 (1인 기준)</label>
            <select id="budgetSelect" class="select-input full-width">
              <option value="상관없음">상관없음</option>
              <option value="1만원 이하">1만원 이하</option>
              <option value="1~2만원">1~2만원</option>
              <option value="2~3만원" selected>2~3만원</option>
              <option value="3~5만원">3~5만원</option>
              <option value="5만원 이상">5만원 이상</option>
            </select>
          </div>

          <!-- 인원 -->
          <div class="form-block">
            <label class="form-block-label" for="peopleSelect">인원</label>
            <select id="peopleSelect" class="select-input full-width">
              <option value="1명">1명</option>
              <option value="2명" selected>2명</option>
              <option value="3명">3명</option>
              <option value="4명">4명</option>
              <option value="5명 이상">5명 이상</option>
            </select>
          </div>
        </div>

        <!-- 분위기 (다중 선택) -->
        <div class="form-block">
          <label class="form-block-label">분위기 <span class="label-hint">(중복 선택 가능)</span></label>
          <div class="chip-select-group multi" id="moodGroup" role="group" aria-label="분위기 선택">
            <button type="button" class="chip-select" data-value="캐주얼">캐주얼</button>
            <button type="button" class="chip-select" data-value="조용한">조용한</button>
            <button type="button" class="chip-select" data-value="데이트">데이트</button>
            <button type="button" class="chip-select" data-value="가족">가족</button>
            <button type="button" class="chip-select" data-value="회식">회식</button>
            <button type="button" class="chip-select" data-value="혼밥">혼밥</button>
            <button type="button" class="chip-select" data-value="분위기 좋은">분위기 좋은</button>
          </div>
        </div>

        <!-- 추가 요청사항 -->
        <div class="form-block">
          <label class="form-block-label" for="requestTextarea">추가 요청사항</label>
          <textarea id="requestTextarea" class="textarea-input full-width" rows="2" placeholder="예: 주차 가능했으면 좋겠어요. 웨이팅이 너무 긴 곳은 제외해주세요."></textarea>
        </div>

        <!-- 오류 메시지 -->
        <div class="form-error" id="formError" style="display:none;"></div>

        <button type="submit" class="primary-btn recommend-btn" id="recommendBtn">
          <span id="recommendBtnText">🍽️ 맛집 추천받기</span>
        </button>
      </form>
    </section>

    <!-- 로딩 상태 -->
    <div class="loading-state" id="loadingState" style="display:none;">
      <div class="loading-spinner"></div>
      <p class="loading-title">🍽️ 맛집을 찾고 있어요...</p>
      <p class="loading-sub">잠시만 기다려주세요.</p>
    </div>

    <!-- 결과 영역 -->
    <main class="result-section" id="resultSection" style="display:none;">
      <h2 class="result-heading" id="resultHeading">추천 결과</h2>
      <div class="restaurant-grid" id="restaurantGrid"></div>
    </main>

    <!-- 빈 상태(Empty State) -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-icon-wrap">🔍</div>
      <h3 class="empty-title">조건에 맞는 맛집을 찾지 못했습니다.</h3>
      <p class="empty-sub">검색 조건을 조금 완화해서 다시 시도해보세요.</p>
    </div>

    <p class="data-disclaimer">* 현재 추천 결과는 데모용 샘플 데이터를 기반으로 합니다.</p>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Script -->
  <script src="/static/js/app.js"></script>
</body>
</html>
